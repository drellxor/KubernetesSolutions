apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: exercises
resources:
- manifests/namespace.yaml
- manifests/configmap.yaml
- manifests/persistentvolumeclaim-gke.yaml
- manifests/gateway.yaml
- manifests/httproute.yaml
- manifests/waypoint.yaml
- log_output/manifests/deployment.yaml
- log_output/manifests/service.yaml
- ping_pong/manifests/deployment.yaml
- ping_pong/manifests/service.yaml
- ping_pong/manifests/statefulset.yaml
- greeter/manifests/deployment.yaml
- greeter/manifests/service.yaml
- greeter/manifests/httproute.yaml
# Built locally and loaded with `k3d image import`; a fixed non-latest tag keeps
# imagePullPolicy at IfNotPresent, so the nodes never try a registry.
images:
- name: EXERCISES/LOGOUTPUT
  newName: exercises/log-output
  newTag: local
- name: EXERCISES/PINGPONG
  newName: exercises/ping-pong
  newTag: local
- name: EXERCISES/GREETER
  newName: exercises/greeter
  newTag: local
