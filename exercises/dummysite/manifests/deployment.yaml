apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummysite-controller
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dummysite-controller
  template:
    metadata:
      labels:
        app: dummysite-controller
    spec:
      serviceAccountName: dummysite-controller
      containers:
        - name: controller
          image: europe-north1-docker.pkg.dev/dwk-gke-508413/dwk-repo/dummysite:1.0
          resources:
            requests:
              cpu: "10m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
