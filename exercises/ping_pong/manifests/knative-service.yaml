# Serverless ping-pong: Knative scales it to zero when idle and back up on the
# next request. The count lives in Postgres, so neither loses it.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ping-pong
  namespace: exercises
  labels:
    # Only log-output and the exercises gateway call it, so it gets no public
    # domain; its address is http://ping-pong.exercises.svc.cluster.local.
    networking.knative.dev/visibility: cluster-local
spec:
  template:
    spec:
      volumes:
        - name: config
          configMap:
            name: exercises-config
            items:
              - key: ping_pong_db.config
                path: ping_pong_db.config
      containers:
        - name: ping-pong
          image: EXERCISES/PINGPONG
          volumeMounts:
            - mountPath: /config
              name: config
          # Knative sets PORT to this; the app reads SERVER_PORT, which the
          # image already sets to 8000.
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
          livenessProbe:
            initialDelaySeconds: 20
            httpGet:
              path: /healthz
