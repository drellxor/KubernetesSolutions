apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: log-output-route
  namespace: exercises
spec:
  parentRefs:
  - name: log-output-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: log-output-svc
      port: 80
  - matches:
    - path:
        type: PathPrefix
        value: /pingpong
    # ping-pong is a Knative service: its Service points at Kourier, which
    # picks the app by Host header, so the rewrite sets it.
    filters:
      - type: URLRewrite
        urlRewrite:
          hostname: ping-pong.exercises.svc.cluster.local
          path:
            type: ReplacePrefixMatch
            replacePrefixMatch: /
    backendRefs:
        - name: ping-pong
          port: 80
  - matches:
    - path:
        type: PathPrefix
        value: /wikipedia
    filters:
      - type: URLRewrite
        urlRewrite:
          path:
            type: ReplacePrefixMatch
            replacePrefixMatch: /
    backendRefs:
        - name: wikipedia-svc
          port: 80
