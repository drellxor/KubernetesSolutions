apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: shared-volume
          persistentVolumeClaim:
            claimName: project-claim
      containers:
        - name: todo-app
          image: todo-app:6.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: project-config
          volumeMounts:
            - mountPath: /usr/src/app/files
              name: shared-volume
