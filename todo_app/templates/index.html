<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo app</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem auto;
        max-width: 40rem;
        padding: 0 1rem;
      }
      img {
        border-radius: 4px;
        max-width: 100%;
      }
      form {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }
      input {
        flex: 1;
        font: inherit;
        padding: 0.4rem 0.6rem;
      }
      button {
        font: inherit;
        padding: 0.4rem 1rem;
      }
    </style>
  </head>
  <body>
    {% if image %}
    <img src="{{ image }}" alt="Hourly image" />
    {% endif %}

    <h1>Todos</h1>

    <form>
      <input
        type="text"
        name="todo"
        maxlength="140"
        placeholder="What needs doing?"
        aria-label="New todo"
        required
      />
      <button type="submit">Send</button>
    </form>

    <ul>
      {% for todo in todos %}
      <li>{{ todo }}</li>
      {% else %}
      <li><em>Nothing to do.</em></li>
      {% endfor %}
    </ul>
  </body>
</html>
