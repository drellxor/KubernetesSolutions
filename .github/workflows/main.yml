name: Release application

on:
  push:
    branches:
      - '**'
    paths:
      - 'project/**'
      - '.github/workflows/main.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: dwk-repo
  APP_IMAGE: todo-app
  BACKEND_IMAGE: todo-backend
  APP_DEP: todo-app-dep
  BACKEND_DEP: todo-backend-dep
  BROADCASTER_IMAGE: todo-broadcaster
  BROADCASTER_DEP: todo-broadcaster-dep
  BRANCH: ${{ github.ref_name }}

jobs:
  build-publish-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3

      - name: 'Use gcloud CLI'
        run: gcloud info

      - run: gcloud --quiet auth configure-docker $REGISTRY

      - name: 'Get GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@v3'
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          project_id: '${{ env.PROJECT_ID }}'
          location: '${{ env.GKE_ZONE }}'

      - name : 'Form the image name'
        run: |-
          echo "APP_IMAGE_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/$APP_IMAGE:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV
          echo "BACKEND_IMAGE_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/$BACKEND_IMAGE:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV
          echo "BROADCASTER_IMAGE_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/$BROADCASTER_IMAGE:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV

      - name: Build
        run: |-
          docker build --tag $APP_IMAGE_TAG ./project/todo_app
          docker build --tag $BACKEND_IMAGE_TAG ./project/todo_backend
          docker build --tag $BROADCASTER_IMAGE_TAG ./project/broadcaster

      - name: Publish
        run: |-
          docker push $APP_IMAGE_TAG
          docker push $BACKEND_IMAGE_TAG
          docker push $BROADCASTER_IMAGE_TAG

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Deploy
        run: |-
          NS=${GITHUB_REF#refs/heads/}
          [ "$NS" = "main" ] && NS=project
          cd project
          kubectl create namespace ${NS} || true
          kubectl config set-context --current --namespace=${NS}
          kustomize edit set namespace ${NS}
          kustomize edit set image PROJECT/APP=$APP_IMAGE_TAG
          kustomize edit set image PROJECT/BACKEND=$BACKEND_IMAGE_TAG
          kustomize edit set image PROJECT/BROADCASTER=$BROADCASTER_IMAGE_TAG
          kustomize build . | kubectl apply -f -
          kubectl rollout status deployment $APP_DEP
          kubectl rollout status deployment $BACKEND_DEP
          kubectl rollout status deployment $BROADCASTER_DEP
          kubectl get services -o wide
