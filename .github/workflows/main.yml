name: Release application

on:
  push:
    branches: ['main']
    tags: ['*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: project-release
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: dwk-repo
  APP_IMAGE: todo-app
  BACKEND_IMAGE: todo-backend
  BROADCASTER_IMAGE: todo-broadcaster

jobs:
  build-publish-deploy:
    name: Build and publish project
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - name: Pick the environment
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
          echo "OVERLAY=overlays/prod" >> $GITHUB_ENV
          echo "IMAGE_TAG_SUFFIX=${{ github.ref_name }}" >> $GITHUB_ENV
          else
          echo "OVERLAY=overlays/staging" >> $GITHUB_ENV
          echo "IMAGE_TAG_SUFFIX=main-$GITHUB_SHA" >> $GITHUB_ENV
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3

      - name: 'Use gcloud CLI'
        run: gcloud info

      - run: gcloud --quiet auth configure-docker $REGISTRY

      - name : 'Form the image name'
        run: |-
          echo "APP_IMAGE_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/$APP_IMAGE:$IMAGE_TAG_SUFFIX" >> $GITHUB_ENV
          echo "BACKEND_IMAGE_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/$BACKEND_IMAGE:$IMAGE_TAG_SUFFIX" >> $GITHUB_ENV
          echo "BROADCASTER_IMAGE_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/$BROADCASTER_IMAGE:$IMAGE_TAG_SUFFIX" >> $GITHUB_ENV

      - name: Build
        run: |-
          docker build --tag $APP_IMAGE_TAG ./project/todo_app
          docker build --tag $BACKEND_IMAGE_TAG ./project/todo_backend
          docker build --tag $BROADCASTER_IMAGE_TAG ./project/broadcaster

      - name: Publish
        run: |-
          docker push $APP_IMAGE_TAG
          docker push $BACKEND_IMAGE_TAG
          docker push $BROADCASTER_IMAGE_TAG

      - name: Checkout main to commit the tag back
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use right image
        run: |-
          cd project/manifests/${OVERLAY}
          kustomize edit set image PROJECT/APP=$APP_IMAGE_TAG
          kustomize edit set image PROJECT/BACKEND=$BACKEND_IMAGE_TAG
          kustomize edit set image PROJECT/BROADCASTER=$BROADCASTER_IMAGE_TAG

      - name: Commit Kustomization.yaml to Github
        uses: EndBug/add-and-commit@v10
        with:
          add: './project/manifests/${{env.OVERLAY}}/kustomization.yaml'
          message: New project version released ${{env.IMAGE_TAG_SUFFIX}}
          pull: '--rebase --autostash'


