name: Release exercises

on:
  push:
    branches:
      - '**'
    paths:
      - 'exercises/**'
      - '.github/workflows/exercises.yml'

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: dwk-repo
  LOG_OUTPUT_IMAGE: log-output
  PING_PONG_IMAGE: ping-pong
  BRANCH: ${{ github.ref_name }}

jobs:
  build-publish-deploy:
    name: Build and Publish exercises
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3

      - name: 'Use gcloud CLI'
        run: gcloud info

      - run: gcloud --quiet auth configure-docker $REGISTRY

      - name : 'Form the image name'
        run: |-
          echo "LOG_OUTPUT_IMAGE_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/$LOG_OUTPUT_IMAGE:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV
          echo "PING_PONG_IMAGE_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/$PING_PONG_IMAGE:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV

      - name: Build
        run: |-
          docker build --tag $LOG_OUTPUT_IMAGE_TAG ./exercises/log_output
          docker build --tag $PING_PONG_IMAGE_TAG ./exercises/ping_pong

      - name: Publish
        run: |-
          docker push $LOG_OUTPUT_IMAGE_TAG
          docker push $PING_PONG_IMAGE_TAG

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use right image
        run: |-
          cd exercises
          kustomize edit set image EXERCISES/LOGOUTPUT=$LOG_OUTPUT_IMAGE_TAG
          kustomize edit set image EXERCISES/PINGPONG=$PING_PONG_IMAGE_TAG

      - name: Commit Kustomization.yaml to Github
        uses: EndBug/add-and-commit@v10
        with:
          add: './exercises/kustomization.yaml'
          message: New exercises version released ${{ github.sha }}
          pull: '--rebase --autostash'
