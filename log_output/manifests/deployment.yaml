apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-volume
          persistentVolumeClaim:
            claimName: generic-claim
      containers:
        - name: log-output-server
          image: log-output:5.0
          volumeMounts:
            - mountPath: /usr/src/app/files
              name: shared-volume
        - name: log-output-writer
          image: log-output:5.0
          volumeMounts:
            - mountPath: /usr/src/app/files
              name: shared-volume
          command: ["python3", "writer.py"]
