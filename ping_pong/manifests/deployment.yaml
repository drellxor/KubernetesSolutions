apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
        - name: shared-log-output
          persistentVolumeClaim:
            claimName: log-output-claim
      containers:
        - name: ping-pong
          image: ping-pong:2.0
          volumeMounts:
            - mountPath: /usr/src/app/files
              name: shared-log-output
