apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
        - name: config
          configMap:
            name: exercises-config
            items:
              - key: ping_pong_db.config
                path: ping_pong_db.config
      containers:
        - name: ping-pong
          image: drellxor/ping-pong:8.0
          volumeMounts:
            - mountPath: /config
              name: config
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            initialDelaySeconds: 10
            periodSeconds: 5
            httpGet:
              port: http
              path: /healthz
