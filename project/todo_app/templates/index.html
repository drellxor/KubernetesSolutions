<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo app</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem auto;
        max-width: 40rem;
        padding: 0 1rem;
      }
      img {
        border-radius: 4px;
        max-width: 100%;
      }
      form {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }
      input {
        flex: 1;
        font: inherit;
        padding: 0.4rem 0.6rem;
      }
      button {
        font: inherit;
        padding: 0.4rem 1rem;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        align-items: center;
        background: #f6f6f6;
        border-left: 4px solid #4a4;
        display: flex;
        gap: 1rem;
        justify-content: space-between;
        margin-bottom: 0.5rem;
        padding: 0.6rem 0.9rem;
      }
      li.done {
        border-left-color: #bbb;
      }
      li.done span:first-child {
        color: #777;
        text-decoration: line-through;
      }
      .label {
        color: #4a4;
        font-weight: bold;
      }
      #break {
        border-color: #a33;
        color: #a33;
        margin-top: 2rem;
      }
    </style>
  </head>
  <body>
    {% if image %}
    <img src="{{ image }}" alt="Hourly image" />
    {% endif %}

    <h1>Todos</h1>

    <form id="new-todo">
      <input
        type="text"
        name="todo"
        maxlength="140"
        placeholder="What needs doing?"
        aria-label="New todo"
        required
      />
      <button type="submit">Send</button>
    </form>

    <ul>
      {% for todo in todos %}
      <li class="{{ 'done' if todo.done }}">
        <span>{{ todo.todo }}</span>
        {% if todo.done %}
        <span class="label">Done</span>
        {% else %}
        <button type="button" class="mark" data-id="{{ todo.id }}">Mark done</button>
        {% endif %}
      </li>
      {% else %}
      <li><em>Nothing to do.</em></li>
      {% endfor %}
    </ul>

    <button id="break" type="button">Break the app</button>

    <script>
      // The browser posts straight to todo-backend, which the ingress serves
      // at /todos, then reloads so the server renders the updated list.
      document.getElementById("new-todo").addEventListener("submit", async (event) => {
        event.preventDefault();
        const input = event.target.elements.todo;
        const response = await fetch("/todos", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ todo: input.value.trim() }),
        });
        if (response.ok) {
          input.value = "";
          location.reload();
        }
      });

      // Mark done posts the new state to the backend, then re-renders.
      document.querySelectorAll("button.mark").forEach((button) => {
        button.addEventListener("click", async () => {
          const response = await fetch(`/todos/${button.dataset.id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ done: true }),
          });
          if (response.ok) location.reload();
        });
      });

      // Stops the app responding, so the probes start failing.
      document.getElementById("break").addEventListener("click", async () => {
        await fetch("/break", { method: "POST" });
        location.reload();
      });
    </script>
  </body>
</html>
