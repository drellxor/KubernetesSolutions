apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/drellxor/KubernetesSolutions.git
    path: project/manifests/overlays/prod
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: project-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/drellxor/KubernetesSolutions.git
    path: project/manifests/overlays/staging
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: project-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
